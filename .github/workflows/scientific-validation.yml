name: Scientific example validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  examples:
    name: Examples on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Record dependency versions
        run: python -m pip freeze > validation-environment.txt
      - name: Run analytical, recorded-fixture, and registry checks
        run: python -m pytest -q -s --junitxml=validation-results.xml
      - name: Reject skipped validation checks
        run: >-
          python -c "import xml.etree.ElementTree as E; r=E.parse('validation-results.xml').getroot(); assert all(int(e.attrib.get('skipped', '0')) == 0 for e in r.iter('testsuite')), 'Skipped tests do not satisfy validation'"
      - name: Lint added checks
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Build wheel
        run: python -m build --wheel
      - name: Install built wheel
        run: >-
          python -c "import pathlib, subprocess, sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - name: Verify installed wheel against recorded data
        run: python -m pytest tests/data tests/real_data/test_signal_containers.py -q
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}-python${{ matrix.python }}
          path: |
            validation-results.xml
            validation-environment.txt
            examples/data/cascade_ds01/manifest.json
            benchmarks/validation_registry.json
          if-no-files-found: error
