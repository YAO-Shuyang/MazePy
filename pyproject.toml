[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazepy"
version = "0.1.0.dev0"
description = "Geometry foundations for spatial navigation and neuroscience."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Shuyang Yao"}]
dependencies = ["numpy>=1.23", "shapely>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "build>=1"]

[project.urls]
Repository = "https://github.com/YAO-Shuyang/MazePy"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mazepy", "mazepy.geometry", "mazepy.geometry.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

